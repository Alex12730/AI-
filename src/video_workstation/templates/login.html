<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>登录 · AI 视频工作站</title>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
</head>
<body class="login-body">
  <main class="login-shell">
    <section class="login-context" aria-labelledby="login-heading">
      <span class="brand-mark brand-mark-large" aria-hidden="true">AV</span>
      <h1 id="login-heading">把每个镜头，放进可控的流程里。</h1>
      <p>本地模型、单 GPU 队列、逐镜头审批与完整追溯。素材停留在工作站内。</p>
      <ul class="plain-list">
        <li><span>01</span>先确认分镜，再消耗显卡时间</li>
        <li><span>02</span>模型档位只按本机实测开放</li>
        <li><span>03</span>成片可回溯到参数、素材和审批</li>
      </ul>
    </section>
    <section class="login-panel" aria-label="账号登录">
      <div>
        <h2>登录工作站</h2>
        <p>使用管理员创建的局域网账号。</p>
      </div>
      {% if error %}<div id="login-error" class="alert alert-error" role="alert">{{ error }}</div>{% endif %}
      <form method="post" action="/login" class="form-stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
        <label for="login-username">用户名<input id="login-username" name="username" value="{{ username }}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus{% if error %} aria-invalid="true" aria-describedby="login-error"{% endif %}></label>
        <label for="login-password">密码<input id="login-password" type="password" name="password" autocomplete="current-password" required{% if error %} aria-invalid="true" aria-describedby="login-error"{% endif %}></label>
        <button class="button button-primary" type="submit">进入制作台</button>
      </form>
      {% if needs_setup %}
      <a class="button button-secondary setup-link" href="/setup">首次设置管理员</a>
      {% endif %}
      <p class="microcopy">系统不提供默认密码。初始化入口仅在工作站本机开放。</p>
    </section>
  </main>
</body>
</html>
